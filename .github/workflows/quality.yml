name: Quality gates

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build

  database:
    name: Fresh database and SQL contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.118.0
      - name: Rebuild schema from migrations
        run: supabase db start
      - name: Lint database functions
        run: supabase db lint --local --level warning
      - name: Ensure PostgreSQL client is available
        shell: bash
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes postgresql-client
          fi
      - name: Run rollback-only SQL contracts
        shell: bash
        run: |
          set -euo pipefail
          database_url="$(supabase status -o json | jq -r '.DB_URL')"
          if [[ -z "$database_url" || "$database_url" == "null" ]]; then
            echo "::error title=Local database URL missing::supabase status did not return DB_URL"
            exit 1
          fi
          for contract in supabase/tests/*.sql; do
            echo "::group::$contract"
            if ! output="$(psql "$database_url" -v ON_ERROR_STOP=1 -f "$contract" 2>&1)"; then
              printf '%s\n' "$output"
              message="$(printf '%s' "$output" | tail -c 4000)"
              message="${message//'%'/'%25'}"
              message="${message//$'\r'/'%0D'}"
              message="${message//$'\n'/'%0A'}"
              echo "::error file=$contract,title=SQL contract failed::$message"
              exit 1
            fi
            printf '%s\n' "$output"
            echo "::endgroup::"
          done
