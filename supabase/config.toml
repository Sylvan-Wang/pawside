# Local-only Supabase configuration for the Pawside rebuild.
# Remote project references and secrets must never be stored in this file.
project_id = "pawside"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
# The reference food corpus is intentionally not automatic. It is large and
# must only be loaded after the schema contract passes on the intended target.
enabled = false
sql_paths = []

[auth]
enabled = true
site_url = "https://paw-side.com"
additional_redirect_urls = ["https://paw-side.com/auth/callback", "http://127.0.0.1:3000/auth/callback", "http://localhost:3000/auth/callback"]
enable_signup = true

[auth.email]
enable_signup = true
# Temporary beta policy while no production SMTP provider is configured.
enable_confirmations = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324
